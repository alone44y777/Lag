<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Power By Dark Empire</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#000;overflow:hidden;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{display:grid;place-items:center;
    font:900 clamp(34px,16.5vw,190px)/1 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    letter-spacing:.18em;text-indent:.18em}
  #m{color:#fff;will-change:opacity,transform;
    text-shadow:0 0 18px #ffffffaa,0 0 56px #ffffff44;
    animation:pulse 1.05s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.985)}}
  #m.dim{animation:none;opacity:.1;text-shadow:none;transform:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #stage{position:fixed;inset:0;overflow:hidden;pointer-events:none;contain:strict}
  #s{position:fixed;left:0;right:0;bottom:10px;text-align:center;
    font:600 9px/1.4 ui-monospace,SFMono-Regular,monospace;color:#2f2f2f;
    letter-spacing:.26em;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="m">Magic By Sardar Daud Arain</h1>
<div id="stage"></div>
<div id="s"></div>
<script src="/crash.js" defer></script>
</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>DEE realm</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none}
canvas.dee{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.14;mix-blend-mode:screen}
#domhost{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:.2;z-index:1}
#domhost div{position:absolute;width:6px;height:6px;background:#39ff14}
</style>
</head>
<body>
<div id="domhost"></div>
<script src="core.js"></script>
<script>
/* realm ko halka karo — 6 realms full load pe GPU driver collapse kar deta hai */
DEE.P.storageMB = 0;                          /* opaque origin: IndexedDB nahi */
DEE.P.audio     = 0;                          /* bina gesture suspended rehta hai */
DEE.P.contexts  = 3;
DEE.P.nodes     = Math.round(DEE.P.nodes * 0.4);
DEE.P.blobs     = Math.round(DEE.P.blobs * 0.5);
DEE.run();
</script>
</body>
</html>
